# Incidentes internos ficticios: NO se listan aquí a mano — se generan reproduciblemente
# con seed=42 en scripts/cargar_eventos.py (ver generar_incidentes_ficticios()), ~6 por año,
# para no tener fechas "elegidas a mano" que parezcan menos honestas que un proceso determinista
# y auditable. Tipos y multiplicadores SUPUESTO:
incidentes_tipos:
  falla_equipo:        { horas_efecto: [6, 12], mult_local: 0.70, mult_delivery: 0.70 }
  corte_luz:            { horas_efecto: [13, 20], mult_local: 0.40, mult_delivery: 0.40 }
  faltante_personal:    { horas_efecto: [6, 9],  mult_local: 0.75, mult_delivery: 0.75 }
  promocion_2x1:        { horas_efecto: [13, 20], mult_local: 1.35, mult_delivery: 1.35 }
  cierre_imprevisto:    { horas_efecto: [15, 20], mult_local: 0.0,  mult_delivery: 0.0 }
